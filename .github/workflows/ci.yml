name: CI

# The performance budget from CLAUDE.md, enforced on every pull request.
# bundle-size and lighthouse both fail the run outright; neither warns. When
# one fails, fix the regression rather than the threshold. See "When the
# performance gate fails" in README.md.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/seeded-build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # JS payload measured from the built output, before anything is deployed:
  # homepage under 45kb (GSAP and ScrollTrigger included), article route under
  # the shared GSAP chunk plus 5kb. Uses the Playwright budget specs in
  # tests/e2e, so the local and CI checks are the same code.
  bundle-size:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - run: npx playwright install --with-deps chromium

      # astro preview only serves dist/, but astro.config.mjs refuses to load
      # without STRAPI_URL. Nothing contacts it outside a draft preview build.
      - name: Serve the build
        env:
          STRAPI_URL: http://127.0.0.1:1337
        run: npx astro preview --port 4400

      - name: Check the JS budgets
        env:
          STRAPI_URL: http://127.0.0.1:1337
        run: npm run test:budget

      - name: Stop the preview server
        if: always()
        env:
          STRAPI_URL: http://127.0.0.1:1337
        run: npx astro preview stop || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # A Workers version preview for this PR, at a stable alias that every push
  # to the PR updates: pr-<number>-slightly-lost.<subdomain>.workers.dev.
  preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Upload a preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npx wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} at ${HEAD_SHA}"
          url="$(node -e "
            const lines = require('fs').readFileSync(process.argv[1], 'utf8').trim().split('\n')
            const upload = lines.map((line) => JSON.parse(line)).find((entry) => entry.type === 'version-upload')
            console.log(upload?.preview_alias_url ?? '')
          " "$WRANGLER_OUTPUT_FILE_PATH")"
          if [ -z "$url" ]; then
            echo "::error::wrangler reported no preview alias URL. Is preview_urls enabled and the workers.dev subdomain set up?"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview for PR #${PR_NUMBER}: $url" >> "$GITHUB_STEP_SUMMARY"

  # Core Web Vitals, page weight, and fonts against the deployed preview, so
  # transfer sizes are what Cloudflare actually sends. Thresholds and the
  # reasoning behind each live in lighthouserc.cjs.
  lighthouse:
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run Lighthouse CI
        env:
          LHCI_BASE_URL: ${{ needs.preview.outputs.url }}
        run: npm run lhci

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14
