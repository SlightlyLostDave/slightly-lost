name: Deploy

# Production: every push to main, plus a manual run (which is also how the
# Worker is created the first time; see "Deploying" in README.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy halfway; queue the next one behind it instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/seeded-build

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npx wrangler deploy --message "${GITHUB_SHA}"
          url="$(node -e "
            const lines = require('fs').readFileSync(process.argv[1], 'utf8').trim().split('\n')
            const deploy = lines.map((line) => JSON.parse(line)).find((entry) => entry.type === 'deploy')
            console.log(deploy?.targets?.find((target) => target.startsWith('https://')) ?? '')
          " "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${GITHUB_SHA} to ${url:-Cloudflare Workers}" >> "$GITHUB_STEP_SUMMARY"
